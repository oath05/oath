name: Build IPA
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - name: Build
        run: |
          xcodebuild archive -scheme AppName -archivePath app.xcarchive
          xcodebuild -exportArchive -archivePath app.xcarchive -exportOptionsPlist export.plist -exportPath ./output
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: ./output/*.ipa
