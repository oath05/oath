name: OathWallpaper
options:
  bundleIdPrefix: com.oath
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

targets:
  OathWallpaper:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oath.wallpaper
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "100"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: 誓言壁纸
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "100"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryAddUsageDescription: 用于把导入的壁纸保存到相册，便于你在系统设置中设为锁屏墙纸。
        NSPhotoLibraryUsageDescription: 用于读取你选择的图片/视频素材来生成壁纸。
        LSApplicationQueriesSchemes:
          - mqq
          - mqqapi
          - mqqwpa
    scheme:
      testTargets: []
